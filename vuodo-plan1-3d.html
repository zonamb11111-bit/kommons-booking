<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>kommons — VUODO plan1 3Dパース（モック）</title>
<style>
:root{--bg:#ece8e0;--ink:#191713;--ink2:#6f6a5e;--line:#c9c2b2;--teal:#14655c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Figtree','Noto Sans JP','Hiragino Sans',sans-serif;background:var(--bg);color:var(--ink)}
#view,#view canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;top:16px;left:16px;z-index:10;background:rgba(236,232,224,.92);border:1px solid var(--line);padding:14px 16px;max-width:250px;backdrop-filter:blur(4px)}
.panel h1{font-size:14px;font-weight:700;letter-spacing:.02em;margin-bottom:2px}
.panel p{font-size:11px;color:var(--ink2);line-height:1.5;margin-bottom:10px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{font-family:inherit;font-size:12px;padding:7px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:all .15s}
.btns button:hover{border-color:var(--teal);color:var(--teal)}
.btns button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.sep{width:100%;height:1px;background:var(--line);margin:4px 0}
.hint{position:fixed;bottom:14px;left:16px;z-index:10;font-size:11px;color:var(--ink2)}
#planOverlay{display:none;position:fixed;inset:0;z-index:20;background:rgba(25,23,19,.78);align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
#planOverlay.show{display:flex}
#planOverlay img{max-width:100%;max-height:100%;background:#fff;box-shadow:0 12px 60px rgba(0,0,0,.4)}
@media(max-width:640px){.panel{max-width:calc(100vw - 32px)}}
</style>
</head>
<body>
<div id="view"></div>
<div class="panel">
  <h1>kommons — 店舗3Dパース</h1>
  <p>VUODO 遠藤さん plan1（平面図）より作成した簡易モックです。寸法は図面ベース、内装仕上げはブランドコンセプト（モルタル×木×青緑タイル）の仮当てです。</p>
  <div class="btns">
    <button data-view>俯瞰</button>
    <button data-view>入口から</button>
    <button data-view>セット面</button>
    <button data-view>シャンプー</button>
    <span class="sep"></span>
    <button data-toggle="ceiling" class="on">天井</button>
    <button data-toggle="labels" class="on">ラベル</button>
    <button data-toggle="plan">図面を見る</button>
  </div>
</div>
<div class="hint">ドラッグ：回転　／　ホイール：ズーム　／　右ドラッグ：移動</div>
